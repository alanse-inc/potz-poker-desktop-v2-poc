name: E2E

on:
  workflow_dispatch:
  schedule:
    # 毎日 UTC 18:00 (JST 03:00) に実行
    - cron: "0 18 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: tauri-driver smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri + WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libssl-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            xvfb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - run: pnpm install --frozen-lockfile

      - name: Build Tauri app (debug)
        run: pnpm tauri build --debug

      - name: Run E2E with virtual display
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' pnpm e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore
